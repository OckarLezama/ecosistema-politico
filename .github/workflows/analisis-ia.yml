name: Análisis con IA — lectura de inteligencia (2x al día)

on:
  schedule:
    # 8:00 hora de Ciudad de México (UTC-6) -- 1 sola vez al día, como se acordó. Las alertas
    # (calculadas en el navegador, sin costo) avisan si algo cambia el resto del día.
    # CORRECCIÓN -- confirmado con evidencia real (huecos de 5+ horas sin publicar en
    # varios workflows del repo, siempre coincidiendo con minutos "redondos" de cron):
    # GitHub Actions documenta que los workflows programados justo en punto o en
    # minutos redondos (:00, :05, :10...) sufren más retraso porque coinciden con la
    # hora pico de TODOS los repos de GitHub, no solo el nuestro. Este workflow y
    # robot-legislativo.yml corrían ambos exactamente a las 14:00 UTC -- se corrigen
    # los minutos de todos los cron del repo a valores no redondos y sin chocar entre sí.
    - cron: '11 14 * * *'
  workflow_dispatch: {}  # permite correrlo manualmente desde GitHub para probar

jobs:
  generar-lectura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install anthropic --break-system-packages

      - name: Generar la lectura de inteligencia con Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 analisis_ia.py

      - name: Guardar el resultado
        run: |
          git config user.name "analisis-ia"
          git config user.email "analisis-ia@ecosistema-politico.local"
          git add data/analisis_ia.json
          git diff --staged --quiet || git commit -m "Análisis IA: actualización $(date -u +%Y-%m-%d)"
          git push
