name: Robot de portadas del día
"on":
  schedule:
    # 10-16 UTC = 4am-10am hora CDMX (Mexico usa UTC-6 fijo, sin horario de
    # verano desde 2022), cada 20 min. Antes eran solo 4 corridas fijas
    # (5,6,7,9am) -- con huecos de hasta 2 horas, un medio que publicaba a
    # las 7:10am no aparecía hasta la corrida de las 9am. Cada corrida es
    # barata cuando ya no queda nada por descargar (revisa y no hace nada),
    # así que correr cada 20 min no tiene costo real y hace que una portada
    # nueva aparezca en minutos, no en horas.
    # CORRECCIÓN -- confirmado con el historial real de commits: en 2 días seguidos, el
    # primer commit del día llegó hasta las 8:08am y 10:13am CDMX respectivamente, muy
    # tarde para una ventana que arranca a las 4am. Igual que los demás cron de este
    # repo, corría en minutos redondos (:00, :20, :40) -- la franja de más carga en
    # GitHub Actions en general. Se corre en minutos no redondos, misma frecuencia.
    # CORRECCIÓN (lunes 05-oct: sin actualizar de 03:00 a 11:30 CDMX hasta correrlo a mano;
    # las imágenes SÍ estaban disponibles, los cron de GitHub simplemente no dispararon).
    # Los cron de GitHub no son confiables, así que ya no dependemos de que cada uno
    # dispare: el cron solo ARRANCA/RELEVA un job que se queda en bucle ~5.5 h corriendo
    # el robot cada 5 min (ver .github/scripts/robot_loop.sh). Cada 30 min hay un cron de
    # relevo; basta con que UNO dispare por job para no tener huecos.
    - cron: '7,37 8-23 * * *'
  workflow_dispatch: {}
concurrency:
  # SIN cancelar: el job en curso es el que hace el trabajo (bucle de ~5.5 h). Un cron
  # nuevo queda en espera y arranca justo cuando el actual termina (relevo continuo).
  # el boton manual (workflow_dispatch) va en OTRO grupo: corre UNA pasada de inmediato en
  # vez de esperar detras del bucle de 5.5 h.
  group: robot-portadas-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'unico' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  capturar-portadas:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Robot de portadas en bucle (cada 5 min)
        env:
          ROBOT_NAME: robot-portadas
          ROBOT_EMAIL: robot@ecosistema-politico.local
          ROBOT_CMD: python3 robot_portadas.py
          ROBOT_FILES: data/titulares.csv data/portadas
          COMMIT_MSG: "Robot: portadas del dia"
          STOP_AT_UTC_HOUR: "0"   # 18:00 CDMX: fin de la ventana de portadas
        run: bash .github/scripts/robot_loop.sh
