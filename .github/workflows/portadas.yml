name: Robot de portadas del día
"on":
  schedule:
    # 10-16 UTC = 4am-10am hora CDMX (Mexico usa UTC-6 fijo, sin horario de
    # verano desde 2022), cada 20 min. Antes eran solo 4 corridas fijas
    # (5,6,7,9am) -- con huecos de hasta 2 horas, un medio que publicaba a
    # las 7:10am no aparecía hasta la corrida de las 9am. Cada corrida es
    # barata cuando ya no queda nada por descargar (revisa y no hace nada),
    # así que correr cada 20 min no tiene costo real y hace que una portada
    # nueva aparezca en minutos, no en horas.
    # CORRECCIÓN -- confirmado con el historial real de commits: en 2 días seguidos, el
    # primer commit del día llegó hasta las 8:08am y 10:13am CDMX respectivamente, muy
    # tarde para una ventana que arranca a las 4am. Igual que los demás cron de este
    # repo, corría en minutos redondos (:00, :20, :40) -- la franja de más carga en
    # GitHub Actions en general. Se corre en minutos no redondos, misma frecuencia.
    - cron: '4,24,44 10-16 * * *'
  workflow_dispatch: {}
concurrency:
  # Si una corrida se atrasa (falla temporal de GitHub Actions) y ya hay
  # otra más nueva en cola o en curso, se cancela la vieja en vez de
  # apilarla. Cada corrida solo llena huecos del día real (hora CDMX), así
  # que una corrida vieja no aporta nada que la más reciente no vuelva a
  # intentar; dejarla en cola solo atrasa que aparezcan las portadas de hoy.
  group: robot-portadas-unico
  cancel-in-progress: true
jobs:
  capturar-portadas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar portadas del día
        run: python3 robot_portadas.py
      - name: Guardar novedades
        run: |
          git config user.name "robot-portadas"
          git config user.email "robot@ecosistema-politico.local"
          git add data/titulares.csv data/portadas
          [ -f data/_diagnostico_jornada.html ] && git add data/_diagnostico_jornada.html
          git diff --staged --quiet || git commit -m "Robot: portadas del dia $(TZ=America/Mexico_City date +%Y-%m-%d)"
          git pull --rebase
          git push
