name: Diagnostico de un tema
"on":
  workflow_dispatch: {}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correr diagnostico
        run: python3 limpiar_tema_actores.py
      - name: Guardar cambios
        run: |
          git config user.name "limpieza-temas"
          git config user.email "limpieza@ecosistema-politico.local"
          git add data/temas.csv data/tema_actores.csv
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Limpieza: agenda nacional y actores vinculados"
            # data/temas.csv y data/tema_actores.csv tambien los edita robot-temas.yml y
            # limpiar-agenda-nacional.yml, que pueden correr al mismo tiempo que esto --
            # un "pull --rebase" sin reintentos truena con conflicto si el remoto avanzo
            # entre el commit y el push, y deja el workflow en rojo sin publicar nada.
            # Se reintenta con rebase (no se descarta nada a la fuerza): si el conflicto
            # es real -- las dos corridas tocaron la misma fila -- se aborta y falla
            # visiblemente para que alguien lo revise, en vez de perder datos en
            # silencio.
            for intento in 1 2 3 4 5; do
              if git push; then
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Conflicto real al reintegrar cambios -- requiere revision manual" >&2
                git rebase --abort
                exit 1
              fi
              if [ "$intento" = "5" ]; then
                echo "No se pudo publicar tras 5 intentos" >&2
                exit 1
              fi
              sleep $((RANDOM % 5 + 1))
            done
          fi
