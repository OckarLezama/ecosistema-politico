name: Diagnostico de un tema
"on":
  workflow_dispatch: {}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correr diagnostico
        run: python3 limpiar_agenda_nacional.py
      - name: Guardar cambios
        run: |
          git config user.name "limpieza-temas"
          git config user.email "limpieza@ecosistema-politico.local"
          git add data/temas.csv data/tema_actores.csv
          git diff --staged --quiet || git commit -m "Limpieza: agenda nacional y actores vinculados"
          git pull --rebase
          git push
