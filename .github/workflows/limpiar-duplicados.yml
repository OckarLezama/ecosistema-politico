name: Limpieza única de duplicados
"on":
  workflow_dispatch: {}
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install feedparser --break-system-packages
      - name: Ejecutar limpieza
        run: python3 limpiar_duplicados.py
      - name: Guardar resultado
        run: |
          git config user.name "robot-temas"
          git config user.email "robot@ecosistema-politico.local"
          git add data/eventos.csv data/temas.csv
          git diff --staged --quiet || git commit -m "Limpieza de duplicados"
          git push
