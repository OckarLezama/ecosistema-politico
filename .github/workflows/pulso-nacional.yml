name: Pulso nacional - termometro politico

"on":
  schedule:
    # CORRECCIÓN -- confirmado con evidencia real: el corte de las 06:00 CDMX seguía sin
    # publicarse a las 10:05, pese a que decide_si_publicar() ya se autocorrige para
    # justo este caso. La causa más probable: minutos de cron redondos (:00, :30) caen
    # en la franja de mayor carga de todo GitHub Actions, no solo este repo. Correr en
    # minutos no redondos no cambia la lógica (sigue bastando con que UNA corrida caiga
    # después de las 06/12/18 en punto), solo evita competir con esa hora pico.
    # CORRECCIÓN (lunes 05-oct: sin actualizar hasta correrlo a mano): los cron de GitHub
    # no son confiables. El cron solo ARRANCA/RELEVA un job en bucle de ~5.5 h que corre el
    # script cada 5 min (ver .github/scripts/robot_loop.sh); el script sigue decidiendo solo
    # si PUBLICA (cortes 06/12/18 o excepción por tensión). Relevo cada 30 min.
    - cron: '6,36 * * * *'   # corre cada 30 min, pero el script decide si PUBLICA:
                              # solo en los 3 cortes fijos (06/12/18 CDMX) o si la
                              # tension se movio lo suficiente para ameritar excepcion
  workflow_dispatch: {}
  # correr esto a mano (boton "Run workflow") ahora siempre publica -- ver
  # decide_si_publicar() en el script, que detecta la corrida manual sola. Se quito el
  # checkbox 'forzar' que existia antes: causaba confusion (quedaba sin marcar sin que se
  # notara) y ya no hace falta ningun input para lograr lo mismo.

concurrency:
  # SIN cancelar: el job en curso hace el trabajo (bucle ~5.5 h); un cron nuevo queda en
  # espera y arranca cuando el actual termina. El boton manual va en OTRO grupo: corre una
  # sola pasada de inmediato (y el script lo detecta y publica siempre).
  group: pulso-nacional-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'unico' }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  calcular-pulso:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Pulso nacional en bucle (cada 5 min; publica solo si corresponde)
        env:
          ROBOT_NAME: robot-pulso
          ROBOT_EMAIL: robot@ecosistema-politico.local
          ROBOT_CMD: python3 calcular_pulso_nacional.py
          ROBOT_FILES: data/pulso_nacional.json
          COMMIT_MSG: "Pulso nacional: corte"
          PUSH_STRATEGY: ours
          # un push con GITHUB_TOKEN no dispara "pages build and deployment": se pide el
          # build de Pages explicitamente tras cada publicacion.
          AFTER_PUSH_CMD: >-
            curl -s -X POST
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
            -H "Accept: application/vnd.github+json"
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
        run: bash .github/scripts/robot_loop.sh
