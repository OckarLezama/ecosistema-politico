name: Robot Legislativo
"on":
  workflow_dispatch: {}
  schedule:
    # CORRECCIÓN -- confirmado con evidencia real: coincidía exactamente con
    # analisis-ia.yml (los dos a las 14:00 UTC en punto), y los minutos redondos son
    # justo cuando GitHub Actions documenta más retraso en workflows programados (hora
    # pico de todo GitHub, no solo este repo). Se corre 26 min después para no chocar.
    - cron: "26 14 * * *"
permissions:
  contents: write
  issues: write
jobs:
  legislativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install feedparser --break-system-packages
      - name: Ejecutar robot legislativo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 robot_legislativo.py
      - name: Guardar resultado
        run: |
          git config user.name "robot-legislativo"
          git config user.email "robot@ecosistema-politico.local"
          git add data/reformas.csv data/candidatos_legislativos.csv data/legislativo_estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Robot Legislativo: actualizacion automatica"
            # Otros robots del repo tambien empujan commits a main y pueden caer justo
            # en este hueco -- un "pull --rebase" sin reintentos truena si el remoto
            # avanzo entre el commit y el push, y deja el workflow en rojo sin publicar
            # nada. Como esos commits tocan archivos distintos, el rebase casi nunca
            # choca de verdad; si llegara a chocar por algo real, se aborta y falla
            # visiblemente en vez de perder datos en silencio.
            for intento in 1 2 3 4 5; do
              if git push; then
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Conflicto real al reintegrar cambios -- requiere revision manual" >&2
                git rebase --abort
                exit 1
              fi
              if [ "$intento" = "5" ]; then
                echo "No se pudo publicar tras 5 intentos" >&2
                exit 1
              fi
              sleep $((RANDOM % 5 + 1))
            done
          fi
