name: Robot de monitoreo - temas Nivel 1
"on":
  schedule:
    - cron: '*/15 * * * *'
    - cron: '*/5 13-16 * * 1-5'
  workflow_dispatch: {}
concurrency:
  group: robot-temas-unico
  cancel-in-progress: false
jobs:
  buscar-candidatos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install feedparser --break-system-packages
      - name: Buscar coincidencias en fuentes RSS reales
        run: python3 robot_buscar_temas.py
      - name: Guardar novedades
        run: |
          git config user.name "robot-temas"
          git config user.email "robot@ecosistema-politico.local"
          git add data/eventos.csv data/candidatos_revision.csv data/temas.csv
          git diff --staged --quiet || git commit -m "Robot: actualizacion automatica $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
