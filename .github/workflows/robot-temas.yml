name: Robot de monitoreo - temas Nivel 1
"on":
  schedule:
    # CORRECCIÓN -- pedido explícito: "tienen notas de hace 5 horas, eso no puede ser".
    # Confirmado con el historial real de commits de data/eventos.csv: el último
    # commit antes del reporte fue a las 10:44 UTC y el siguiente no llegó sino hasta
    # 5+ horas después -- un hueco enorme para un cron que corre cada 15 (o cada 5)
    # minutos. La causa más probable, documentada por GitHub: TODOS los cron de este
    # repo disparaban en minutos redondos (:00, :05, :10, :15...), que es exactamente
    # la franja de mayor carga de TODO GitHub Actions (no solo este repo) y donde más
    # se retrasan o se saltan corridas programadas. Se corren los mismos 2 cron con la
    # misma frecuencia, pero en minutos no redondos.
    - cron: '3,18,33,48 * * * *'
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 13-16 * * 1-5'
  workflow_dispatch: {}
concurrency:
  # Mismo fix que portadas.yml y pulso-nacional.yml: con cron cada 5-15 min, una corrida
  # atrasada que se queda en cola detrás de otras retrasa la captura de notas nuevas por
  # horas en vez de minutos -- justo el síntoma reportado (una nota de último momento que
  # no aparecía). Al cancelar la vieja en cuanto entra una más nueva, se evita el backlog.
  group: robot-temas-unico
  cancel-in-progress: true
jobs:
  buscar-candidatos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install feedparser --break-system-packages
      - name: Buscar coincidencias en fuentes RSS reales
        run: python3 robot_buscar_temas.py
      - name: Guardar novedades
        run: |
          git config user.name "robot-temas"
          git config user.email "robot@ecosistema-politico.local"
          git add data/eventos.csv data/candidatos_revision.csv data/temas.csv data/menciones_actores_c3.csv data/tema_actores.csv
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Robot: actualizacion automatica $(date -u +%Y-%m-%d)"
            # data/temas.csv y data/tema_actores.csv tambien los edita
            # limpiar-agenda-nacional.yml y diagnostico-tema.yml, que pueden correr al
            # mismo tiempo que esto -- un "pull --rebase" sin reintentos truena con
            # conflicto si el remoto avanzo entre el commit y el push, y deja el
            # workflow en rojo sin publicar nada. Se reintenta con rebase (no se
            # descarta nada a la fuerza): si el conflicto es real -- las dos corridas
            # tocaron la misma fila -- se aborta y falla visiblemente para que alguien
            # lo revise, en vez de perder datos en silencio.
            for intento in 1 2 3 4 5; do
              if git push; then
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Conflicto real al reintegrar cambios -- requiere revision manual" >&2
                git rebase --abort
                exit 1
              fi
              if [ "$intento" = "5" ]; then
                echo "No se pudo publicar tras 5 intentos" >&2
                exit 1
              fi
              sleep $((RANDOM % 5 + 1))
            done
          fi
