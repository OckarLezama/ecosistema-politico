name: Robot de monitoreo - temas Nivel 1
"on":
  schedule:
    # CORRECCIÓN -- pedido explícito: "tienen notas de hace 5 horas, eso no puede ser".
    # Confirmado con el historial real de commits de data/eventos.csv: el último
    # commit antes del reporte fue a las 10:44 UTC y el siguiente no llegó sino hasta
    # 5+ horas después -- un hueco enorme para un cron que corre cada 15 (o cada 5)
    # minutos. La causa más probable, documentada por GitHub: TODOS los cron de este
    # repo disparaban en minutos redondos (:00, :05, :10, :15...), que es exactamente
    # la franja de mayor carga de TODO GitHub Actions (no solo este repo) y donde más
    # se retrasan o se saltan corridas programadas. Se corren los mismos 2 cron con la
    # misma frecuencia, pero en minutos no redondos.
    # CORRECCIÓN (lunes 05-oct: sin notas nuevas de 03:14 a 11:30 CDMX hasta correrlo a
    # mano): los cron de GitHub no son confiables, así que ya no dependemos de que cada
    # uno dispare. El cron solo ARRANCA/RELEVA un job que se queda en bucle ~5.5 h
    # corriendo el robot cada 5 min (ver .github/scripts/robot_loop.sh); un cron de
    # relevo cada 30 min basta para que no haya huecos.
    - cron: '9,39 * * * *'
  workflow_dispatch: {}
concurrency:
  # SIN cancelar: el job en curso hace el trabajo (bucle ~5.5 h); un cron nuevo queda en
  # espera y arranca cuando el actual termina (relevo continuo, sin huecos).
  # el boton manual (workflow_dispatch) va en OTRO grupo: corre UNA pasada de inmediato en
  # vez de esperar detras del bucle de 5.5 h.
  group: robot-temas-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'unico' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  buscar-candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install feedparser --break-system-packages
      - name: Robot de temas en bucle (cada 5 min)
        env:
          ROBOT_NAME: robot-temas
          ROBOT_EMAIL: robot@ecosistema-politico.local
          ROBOT_CMD: python3 robot_buscar_temas.py; python3 aplicar_revision_notas.py; python3 curar_actores.py; python3 agrupar_historias.py; python3 auditar_temas.py; node radar_snapshot.js
          ROBOT_FILES: data/eventos.csv data/candidatos_revision.csv data/temas.csv data/menciones_actores_c3.csv data/tema_actores.csv data/actores.csv data/agrupacion_log.csv data/radar_historial.csv data/radar_validacion.json data/radar_alertas.json data/auditoria_temas.csv data/auditoria_actores.csv data/actor_tema_visto.json
          COMMIT_MSG: "Robot: actualizacion automatica"
          # opcional: alertas y resumen diario por Telegram (Settings > Secrets and variables > Actions).
          # Si no existen, el robot simplemente no envía nada.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/robot_loop.sh
