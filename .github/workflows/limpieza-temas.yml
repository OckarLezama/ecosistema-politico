name: Limpieza única - temas auto mal escalados
"on":
  workflow_dispatch: {}
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correr limpieza
        run: python3 limpiar_temas_auto.py
      - name: Guardar cambios
        run: |
          git config user.name "limpieza-temas"
          git config user.email "limpieza@ecosistema-politico.local"
          git add data/temas.csv
          git diff --staged --quiet || git commit -m "Limpieza: bajar temas auto mal escalados a agenda nacional"
          git push
