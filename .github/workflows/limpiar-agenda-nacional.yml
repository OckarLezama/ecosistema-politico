name: Limpieza diaria - agenda nacional (Nivel 1)
"on":
  schedule:
    # CORRECCIÓN -- mismo criterio que el resto de los cron de este repo: minutos
    # redondos coinciden con la hora de mayor carga de GitHub Actions en general.
    - cron: '16 12 * * *'   # ~06:00 hora CDMX todos los días (12:00 UTC)
  workflow_dispatch: {}
concurrency:
  group: limpiar-agenda-nacional-unico
  cancel-in-progress: false
jobs:
  reevaluar-nivel-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reevaluar temas ya marcados como agenda nacional
        run: python3 limpiar_agenda_nacional.py
      - name: Guardar cambios
        run: |
          git config user.name "robot-temas"
          git config user.email "robot@ecosistema-politico.local"
          git add data/temas.csv data/tema_actores.csv
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Limpieza automatica: reevaluacion de agenda nacional $(date -u +%Y-%m-%d)"
            # data/temas.csv y data/tema_actores.csv tambien los edita robot-temas.yml y
            # diagnostico-tema.yml, que pueden correr al mismo tiempo que esto -- un
            # "pull --rebase" sin reintentos truena con conflicto si el remoto avanzo
            # entre el commit y el push, y deja el workflow en rojo sin publicar nada.
            # Se reintenta con rebase (no se descarta nada a la fuerza): si el conflicto
            # es real -- las dos corridas tocaron la misma fila -- se aborta y falla
            # visiblemente para que alguien lo revise, en vez de perder datos en
            # silencio.
            for intento in 1 2 3 4 5; do
              if git push; then
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Conflicto real al reintegrar cambios -- requiere revision manual" >&2
                git rebase --abort
                exit 1
              fi
              if [ "$intento" = "5" ]; then
                echo "No se pudo publicar tras 5 intentos" >&2
                exit 1
              fi
              sleep $((RANDOM % 5 + 1))
            done
          fi
